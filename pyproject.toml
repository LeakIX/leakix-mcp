[project]
name = "leakix-mcp"
version = "0.2.0"
description = "MCP server for LeakIX API - security research and reconnaissance"
readme = "README.md"
license = "MIT"
authors = [
    { name = "LeakIX", email = "support@leakix.net" },
    { name = "Valentin Lobstein", email = "valentin@leakix.net" },
]
keywords = ["mcp", "leakix", "security", "reconnaissance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "leakix>=1.0.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
leakix-mcp = "leakix_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "hypothesis>=6.165.9",
    "pytest-cov>=7.1.0",
    "pip-audit>=2.10.1",
    "cyclonedx-bom>=7.3.1",
    "nox>=2026.8.10",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "zizmor>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/leakix_mcp/", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/leakix_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/leakix_mcp/resources/SKILLS.md" = "leakix_mcp/resources/SKILLS.md"

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (SAST)
    "ASYNC", # flake8-async
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "PIE",   # flake8-pie
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented-out code)
    "RUF",   # ruff-specific
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert (S101), fixtures/handlers with intentionally unused
# arguments (ARG), and 0.0.0.0 as sample data (S104).
"tests/**" = ["S101", "ARG001", "ARG002", "PLW", "S104"]
# 0.0.0.0 is the intended default listen host (bind all interfaces) for the
# containerized HTTP transport; it is feature-gated off by default.
"src/leakix_mcp/address.py" = ["S104"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["leakix_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
